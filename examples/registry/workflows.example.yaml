# n8n Operator — example workflow registry
#
# This file is the allowlist. A workflow absent from it is invisible and unexecutable,
# however live it is on the n8n instance (ADR-002).
#
# Authoring guide:   docs/WORKFLOW_REGISTRY.md
# Normative schema:  docs/BUILD_PLAN.md section 6
#
# Validate before serving:
#     n8n-operator registry validate --path examples/registry/workflows.example.yaml
#
# This file is designed to be committed. It contains no secrets and no instance URL:
# `secret_ref` holds an indirect reference, and `trigger.path` is a path only (R6, R8).
#
# `trigger.correlation` declares whether the workflow returns the Operator response
# envelope carrying an n8n execution ID. `none` (the default) stays fully executable but
# cannot be reconciled by execution ID after an indeterminate dispatch; preflight reports
# that as a non-blocking warning (ADR-009).

apiVersion: n8n-operator/v1

metadata:
  name: example
  description: Annotated sample registry demonstrating each side-effect class.

defaults:
  approval: required
  timeout_seconds: 60
  approval_ttl_seconds: 900
  execution_ttl_seconds: 300

workflows:
  # ---------------------------------------------------------------------------
  # read_only — the only class permitted to skip human approval (rule R5).
  # ---------------------------------------------------------------------------
  - id: reports.pipeline_summary
    n8n_workflow_id: "7Qx4kLmN2pRstUvW"
    title: Summarize the current sales pipeline
    description: >
      Returns aggregate pipeline figures by stage for a date range. Reads only; writes
      nothing anywhere. Use for reporting questions about deal volume or stage mix.
    owner: carolyn
    version: 1
    definition_hash: "sha256:3f2c8a91d4e57b60c1a8f3927d5e6b40a29f18c7d3b5e0a4f6c9d2e8b7a10f53"
    risk: low
    side_effects: read_only
    approval: none
    trigger:
      type: webhook
      method: POST
      path: /webhook/pipeline-summary
      auth: header
      secret_ref: env:N8N_WEBHOOK_TOKEN_REPORTS
    input_schema:
      type: object
      additionalProperties: false
      required: [start_date, end_date]
      properties:
        start_date:
          type: string
          format: date
          description: Inclusive start of the reporting window, YYYY-MM-DD.
        end_date:
          type: string
          format: date
          description: Inclusive end of the reporting window, YYYY-MM-DD.
        stage:
          type: string
          enum: [prospecting, qualified, proposal, closed_won, closed_lost]
          description: Optional. Restrict the summary to a single pipeline stage.
    output:
      max_bytes: 32768
      include_node_trace: true
    limits:
      timeout_seconds: 45
      max_concurrent: 2
      # Two dates and an optional enum: nothing legitimate is anywhere near this (R11).
      max_argument_bytes: 4096
    tags: [reports, sales]

  # ---------------------------------------------------------------------------
  # external_write — recoverable downstream change. Approval is mandatory.
  # ---------------------------------------------------------------------------
  - id: crm.sync_contact
    n8n_workflow_id: "AbC123dEfG456hIj"
    title: Sync a contact into the CRM
    description: >
      Upserts one contact by email address: creates the record if absent, updates it if
      present. Does not send any message to the contact.
    owner: carolyn
    version: 3
    definition_hash: "sha256:9d4b7e1c05a3f826b0d47e93c1a5f80b2e6d19c4a7f30b58e2c9d1a6b430f7e8"
    risk: medium
    side_effects: external_write
    approval: required
    trigger:
      type: webhook
      method: POST
      path: /webhook/crm-sync-contact
      auth: header
      secret_ref: env:N8N_WEBHOOK_TOKEN_CRM
      correlation: response_envelope
    input_schema:
      type: object
      additionalProperties: false
      required: [email, tier]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Contact's primary email. Used as the upsert key.
        tier:
          type: string
          enum: [free, pro, enterprise]
          description: Subscription tier to set on the contact record.
        notes:
          type: string
          maxLength: 2000
          description: Optional free-text note appended to the contact record.
    output:
      redact:
        - "$.contact.email"
        - "$.contact.phone"
        - "$..api_key"
      max_bytes: 16384
      include_node_trace: false
    limits:
      timeout_seconds: 30
      approval_ttl_seconds: 900
      execution_ttl_seconds: 180
      max_concurrent: 1
      rate_limit_per_minute: 10
      max_argument_bytes: 16384
    tags: [crm, contacts]

  # ---------------------------------------------------------------------------
  # irreversible — cannot be recalled. Short windows, low limits, forced approval.
  # ---------------------------------------------------------------------------
  - id: comms.send_customer_email
    n8n_workflow_id: "Kp9RtY2mNqXvB4Lc"
    title: Send an email to a customer
    description: >
      Sends a single email to one customer address through the transactional provider.
      The email leaves immediately and cannot be recalled. Use only when the user has
      explicitly asked to send a message and has seen the exact body.
    owner: carolyn
    version: 2
    definition_hash: "sha256:7b1e4d0a95c3f28e6d4a17b09c5e83f2a6d19b47c0e5a3f81d6c297b4e0a538f"
    risk: high
    side_effects: irreversible
    approval: required
    trigger:
      type: webhook
      method: POST
      path: /webhook/send-customer-email
      auth: header
      secret_ref: env:N8N_WEBHOOK_TOKEN_COMMS
      # Irreversible: "did it actually send?" must be answerable exactly.
      correlation: response_envelope
    input_schema:
      type: object
      additionalProperties: false
      required: [to, subject, body]
      properties:
        to:
          type: string
          format: email
          maxLength: 254
          description: Single recipient address. Exactly one; no CC or BCC.
        subject:
          type: string
          maxLength: 200
          description: Subject line, as it will appear. No templating is applied.
        body:
          type: string
          maxLength: 10000
          description: >
            Plain-text body, sent verbatim. Show this to the user for confirmation
            before preparing the operation.
    output:
      redact:
        - "$.to"
        - "$..message_id"
      max_bytes: 4096
      include_node_trace: false
    limits:
      timeout_seconds: 20
      approval_ttl_seconds: 600
      execution_ttl_seconds: 120
      max_concurrent: 1
      rate_limit_per_minute: 5
      max_argument_bytes: 16384
    tags: [comms, customer-facing]

  # ---------------------------------------------------------------------------
  # Retired entries stay in the file with `enabled: false` so audit readers can make
  # sense of historical operations (WORKFLOW_REGISTRY section 9.3).
  # ---------------------------------------------------------------------------
  - id: legacy.import_leads
    n8n_workflow_id: "Zz1QwErTyUiOpAsD"
    title: Bulk import leads from a CSV URL
    description: Retired 2026-07-01; superseded by crm.sync_contact.
    owner: carolyn
    version: 4
    definition_hash: "sha256:1c8f0a4e73b96d25a0e4f18c7b3d5920e6a4c1f83d70b2e5a9c6d3f0b148e72a"
    risk: high
    side_effects: external_write
    approval: required
    enabled: false
    trigger:
      type: webhook
      method: POST
      path: /webhook/import-leads
      auth: header
      secret_ref: env:N8N_WEBHOOK_TOKEN_LEGACY
    input_schema:
      type: object
      additionalProperties: false
      required: [csv_url]
      properties:
        csv_url:
          type: string
          format: uri
          maxLength: 2048
          description: HTTPS URL of the CSV to import.
    tags: [legacy]
