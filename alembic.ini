# Alembic configuration.
#
# Every schema change is a migration; the schema is never created by `create_all`
# outside tests (ADR-004 rule D6). The database URL is supplied at runtime from
# N8N_OPERATOR_DATABASE_URL by storage/migrations/env.py, so no connection string is
# committed here.

[alembic]
script_location = src/n8n_operator/storage/migrations
prepend_sys_path = src
path_separator = os
file_template = %%(rev)s_%%(slug)s
timezone = UTC

# sqlalchemy.url is intentionally omitted — see env.py.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
