name: Feature request
description: Propose a bounded capability or operability improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What operator or agent problem needs solving?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the behavior, not only an implementation.
    validations:
      required: true
  - type: dropdown
    id: boundary
    attributes:
      label: Expected version boundary
      options: [v1 operability or fix, v2 multi-user platform, v3 authoring or evaluation, Unsure]
  - type: textarea
    id: safety
    attributes:
      label: Safety and compatibility considerations
      description: Note any approval, credential, audit, retry, or client-compatibility impact.
