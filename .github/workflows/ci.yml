name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  check:
    name: lint · types · tests · docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Documentation consistency
        run: uv run python scripts/check_docs_consistency.py

      - name: Tests
        # Live-n8n tests are opt-in and never run in CI (BUILD_PLAN section 10.1).
        run: >-
          uv run pytest -m "not live_n8n"
          --cov=src/n8n_operator
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=90

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  package:
    name: build · clean-install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Build distributions
        run: uv build

      - name: Verify the built wheel in isolation
        run: scripts/release_smoke.sh

      - name: Upload verified distributions
        uses: actions/upload-artifact@v4
        with:
          name: n8n-operator-${{ github.sha }}
          path: dist/
