name: Live n8n compatibility

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    name: real instance contract
    runs-on: ubuntu-latest
    environment: live-n8n
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --all-extras --dev
      - name: Run live compatibility contract
        env:
          N8N_LIVE_BASE_URL: ${{ vars.N8N_LIVE_BASE_URL }}
          N8N_LIVE_WORKFLOW_ID: ${{ vars.N8N_LIVE_WORKFLOW_ID }}
          N8N_LIVE_WEBHOOK_PATH: ${{ vars.N8N_LIVE_WEBHOOK_PATH }}
          N8N_LIVE_API_KEY: ${{ secrets.N8N_LIVE_API_KEY }}
        run: uv run pytest -m live_n8n -v
